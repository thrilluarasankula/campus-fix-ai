<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - CampusFixAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand"><i class="fa-solid fa-wrench"></i>Campus<span>FixAI</span> <small>ADMIN</small></div>
  <button class="btn small" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
<main class="container">
  <section class="hero">
    <div>
      <p class="eyebrow">ADMIN CONTROL CENTER</p>
      <h1>Complaint Dashboard</h1>
      <p>Monitor campus issues, assign maintenance teams, and update resolution statuses.</p>
    </div>
  </section>

  <div class="stats">
    <div class="stat">
      <div class="stat-icon total"><i class="fa-solid fa-folder-open"></i></div>
      <div><b id="aTotal">0</b><span>Total Complaints</span></div>
    </div>
    <div class="stat">
      <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
      <div><b id="aPending">0</b><span>Pending</span></div>
    </div>
    <div class="stat">
      <div class="stat-icon progress"><i class="fa-solid fa-spinner"></i></div>
      <div><b id="aProgress">0</b><span>In Progress</span></div>
    </div>
    <div class="stat">
      <div class="stat-icon resolved"><i class="fa-solid fa-circle-check"></i></div>
      <div><b id="aResolved">0</b><span>Resolved</span></div>
    </div>
  </div>

  <section class="card">
    <div class="toolbar">
      <div style="position: relative;">
        <input id="search" placeholder="Search ID, title, location..." oninput="renderAdmin()" style="padding-left: 38px;">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 16px; color: var(--text-muted);"></i>
      </div>
      <select id="statusFilter" onchange="renderAdmin()">
        <option value="ALL">All Statuses</option>
        <option value="SUBMITTED">Submitted</option>
        <option value="IN REVIEW">In Review</option>
        <option value="IN PROGRESS">In Progress</option>
        <option value="RESOLVED">Resolved</option>
      </select>
      <select id="priorityFilter" onchange="renderAdmin()">
        <option value="ALL">All Priorities</option>
        <option value="HIGH">High</option>
        <option value="MEDIUM">Medium</option>
        <option value="LOW">Low</option>
      </select>
    </div>
    <div id="adminList"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
