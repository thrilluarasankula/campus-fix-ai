<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - CampusFixAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="brand"><i class="fa-solid fa-wrench"></i>Campus<span>FixAI</span></div>
  <p class="muted" style="margin-bottom: 20px;">Administrator Access Portal</p>
  <form onsubmit="adminLoginPage(event)">
    <label><i class="fa-solid fa-envelope"></i> Email Address</label>
    <input id="email" type="email" value="admin@campusfix.ai" required placeholder="admin@campusfix.ai">
    <label><i class="fa-solid fa-lock"></i> Password</label>
    <input id="password" type="password" value="admin123" required placeholder="••••••••">
    <button class="btn primary full" type="submit"><i class="fa-solid fa-shield-halved"></i> Login as Admin</button>
  </form>
  <p id="msg" class="message"></p>
  <div style="margin-top: 20px;">
    <a href="index.html" class="muted"><i class="fa-solid fa-arrow-left"></i> Back to main login</a>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
